<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ShortForge — AI Video Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f0f14;
    color: #eaeaf0;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
    margin: 0;
  }
  .card {
    background: #1a1a22;
    border-radius: 16px;
    padding: 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #999; margin: 0 0 24px; font-size: 14px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #101015;
    color: #fff;
    font-size: 15px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #5b5bf5;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  .status {
    margin-top: 20px;
    font-size: 14px;
    color: #aaa;
    min-height: 20px;
  }
  .status.error { color: #ff6b6b; }
  .status.done { color: #4ade80; }
  video {
    width: 100%;
    border-radius: 12px;
    margin-top: 16px;
    display: none;
    background: black;
  }
  .script-box {
    margin-top: 16px;
    font-size: 13px;
    color: #ccc;
    background: #101015;
    border-radius: 8px;
    padding: 12px;
    white-space: pre-wrap;
    display: none;
  }
  a.download {
    display: none;
    margin-top: 12px;
    text-align: center;
    color: #5b5bf5;
    text-decoration: none;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>ShortForge</h1>
  <p class="sub">Generate a short-form AI video from any topic.</p>

  <input id="topic" type="text" placeholder="e.g. black holes, stoicism, cristiano ronaldo" />
  <button id="generateBtn">Generate video</button>

  <div id="status" class="status"></div>
  <div id="scriptBox" class="script-box"></div>
  <video id="video" controls></video>
  <a id="downloadLink" class="download" download>Download video</a>
</div>

<script>
  const API_BASE = window.location.origin;

  const topicInput = document.getElementById("topic");
  const generateBtn = document.getElementById("generateBtn");
  const statusEl = document.getElementById("status");
  const scriptBox = document.getElementById("scriptBox");
  const videoEl = document.getElementById("video");
  const downloadLink = document.getElementById("downloadLink");

  let pollTimer = null;

  function setStatus(text, type = "") {
    statusEl.textContent = text;
    statusEl.className = "status " + type;
  }

  async function generateVideo() {
    const topic = topicInput.value.trim();
    if (!topic) {
      setStatus("Please enter a topic.", "error");
      return;
    }

    generateBtn.disabled = true;
    videoEl.style.display = "none";
    scriptBox.style.display = "none";
    downloadLink.style.display = "none";
    setStatus("Submitting job...");

    try {
      const res = await fetch(`${API_BASE}/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || err.error || `Request failed (${res.status})`);
      }

      const data = await res.json();
      setStatus("Job queued — generating script, audio, and video...");
      pollStatus(data.job_id);
    } catch (e) {
      setStatus(`Error: ${e.message}`, "error");
      generateBtn.disabled = false;
    }
  }

  function pollStatus(jobId) {
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${API_BASE}/status/${jobId}`);

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Status check failed (${res.status})`);
      }

      const data = await res.json();

      if (data.status === "completed") {
        clearInterval(pollTimer);
        setStatus("Done!", "done");
        generateBtn.disabled = false;

        scriptBox.textContent = data.script;
        scriptBox.style.display = "block";

        const videoUrl = `${API_BASE}${data.download_url}`;
        videoEl.src = videoUrl;
        videoEl.style.display = "block";

        downloadLink.href = videoUrl;
        downloadLink.style.display = "block";
      } else if (data.status === "failed") {
        clearInterval(pollTimer);
        setStatus(`Failed: ${data.error}`, "error");
        generateBtn.disabled = false;
      } else {
        setStatus(`Status: ${data.status}...`);
      }
    } catch (e) {
      clearInterval(pollTimer);
      setStatus(`Error checking status: ${e.message}`, "error");
      generateBtn.disabled = false;
    }
  }, 3000);
}

  generateBtn.addEventListener("click", generateVideo);
  topicInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") generateVideo();
  });
</script>

</body>
</html>
